<body>
  <!-- Какая-то обертка страницы -->
  <main class="page">
    
    <!-- Ваш контейнер с контентом -->
    <div class="content">
      
      <!-- Форма поиска -->
      <form class="search-form">
        <!-- Обертка для чекбоксов -->
        <fieldset class="search-form__fieldset">
          <legend class="search-form__fieldset-title">Жанры</legend>
          
          <!-- Список чекбоксов -->
          <div class="search-form__checkbox-list">
            
            <!-- Один чекбокс -->
            <label class="search-form__label">
              <input type="checkbox" class="search-form__checkbox visually-hidden">
              <span class="search-form__pseudo-checkbox"></span>
              <span class="search-form__label-text">Комедия</span>
            </label>
            
          </div>
        </fieldset>
        
        <!-- Текстовое поле -->
        <label class="search-form__label">
          <input type="text" class="search-form__textfield" placeholder="Название фильма">
        </label>
        
      </form>
      
    </div>
  </main>
</body>
